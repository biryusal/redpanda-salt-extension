name: Broker formula checks
on: [push, pull_request]
jobs:
  unit-and-render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        salt: ['3007.8', '3008.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt salt==${{ matrix.salt }}
      - run: pytest -q
